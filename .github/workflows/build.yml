name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:renovate
      - run: node tests/extraction.cjs
  builds:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        platform: [wasm-web, arm64-android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          verify-signature: true
          java-version: '25.0.4+101.0.LTS'
      - name: Bundle
        run: tools/build.sh '${{ matrix.platform }}' '${{ matrix.platform == 'arm64-android' && 'debug' || 'release' }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moon-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/MOON/
          retention-days: 14
          if-no-files-found: error
      - if: matrix.platform == 'wasm-web' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/wasm-web/MOON
  browser:
    name: Browser physics
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          verify-signature: true
          java-version: '25.0.4+101.0.LTS'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: tools/build.sh wasm-web debug
      - run: npm run test:browser
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: warn
  pages:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main'
    needs: [validate, builds, browser]
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
